# laya-hub on Coolify (build pack: Docker Compose, location: /docker-compose.yml).
# No host ports are published: Coolify's proxy routes domains to containers.
#   backend   - internal only (port 8080). Give it NO domain unless you want /v1 public.
#   dashboard - the only service that gets a domain, e.g. https://hub.example.com:3000

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      ADMIN_SECRET: ${ADMIN_SECRET:?set ADMIN_SECRET}
      LAYA_MODELS: ${LAYA_MODELS:-english}
      LAYA_THREADS: ${LAYA_THREADS:-4}
      MAX_CONCURRENCY: ${MAX_CONCURRENCY:-2}
      QUEUE_TIMEOUT_S: ${QUEUE_TIMEOUT_S:-30}
      UNLOADED_MODEL_POLICY: ${UNLOADED_MODEL_POLICY:-reject}
      MAX_STATE_BYTES: ${MAX_STATE_BYTES:-20000}
      MAX_QUESTIONS: ${MAX_QUESTIONS:-20}
      MAX_CHOICE_OPTIONS: ${MAX_CHOICE_OPTIONS:-10}
      MAX_BODY_BYTES: ${MAX_BODY_BYTES:-256000}
      DEFAULT_RATE_LIMIT: ${DEFAULT_RATE_LIMIT:-60}
      LOG_REQUEST_BODIES: ${LOG_REQUEST_BODIES:-false}
      ALLOW_ADMIN_VIA_PROXY: ${ALLOW_ADMIN_VIA_PROXY:-false}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/hub.db}
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - models:/models
      - data:/data
    mem_limit: 3g
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      # The first boot downloads the model (~1.7 GB) before /health turns green.
      start_period: 15m

  dashboard:
    build:
      context: ./dashboard
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      BACKEND_URL: http://backend:8080
      ADMIN_SECRET: ${ADMIN_SECRET:?set ADMIN_SECRET}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      DEFAULT_RATE_LIMIT: ${DEFAULT_RATE_LIMIT:-60}
    depends_on:
      - backend  # started, not healthy: the dashboard works (and shows "loading") while the model loads
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  models:
  data:
